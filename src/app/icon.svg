<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    Фавиконка. Знак логотипа, адаптированный под 16 пикселей.

    Отличия от знака в шапке: убрана третья дуга (на 16px она сливается
    с соседними в серое пятно), увеличена толщина штриха, скруглённые
    концы заменены на плоские — на маленьком размере скругления
    выглядят как размытие.

    Фон — сплошной синий заливкой, а не прозрачный: во вкладке иконка
    стоит на светлом, на тёмном и на цветной закладке. Белый знак на
    синем читается везде.
  -->
  <rect width="32" height="32" rx="7" fill="#2563eb"/>
  <g fill="none" stroke="#ffffff" stroke-width="2.6" stroke-linecap="round">
    <path d="M7 11h9a6 6 0 0 1 6 6v4"/>
    <path d="M7 19h6a2.5 2.5 0 0 1 2.5 2.5V23" stroke-opacity="0.55"/>
  </g>
  <circle cx="22" cy="8.5" r="2.1" fill="#ffffff"/>
</svg>
